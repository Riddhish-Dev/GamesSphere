<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameSphere - One Hub. Five Games. Endless Fun.</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">

    <!-- BACKGROUND GRAPHICS OVERLAY -->
    <div class="bg-effects">
        <div class="bg-glow spot-1"></div>
        <div class="bg-glow spot-2"></div>
        <div class="bg-grid-pattern"></div>
    </div>

    <div class="app-container">
        <!-- LOGIN / WELCOME VIEW -->
        <main class="welcome-layout">
            
            <!-- LEFT SIDE: BRAND & TAGLINE -->
            <section class="welcome-left">
                <div class="hero-logo-container">
                    <div class="logo-icon-wrap">
                        <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                            <polyline points="2 17 12 22 22 17"></polyline>
                            <polyline points="2 12 12 17 22 12"></polyline>
                        </svg>
                    </div>
                    <h1 class="brand-name">GAMESPHERE</h1>
                </div>

                <h2 class="hero-tagline">One Hub. Five Games. Endless Fun.</h2>
                <p class="hero-desc">
                    A collection of classic and strategic games in one place.
                </p>

                <!-- GAME PREVIEW PILLS -->
                <div class="game-pills-row">
                    <div class="pill-item">
                        <span class="pill-icon">♟️</span> Chess
                    </div>
                    <div class="pill-item">
                        <span class="pill-icon">❌</span> Tic-Tac-Toe
                    </div>
                    <div class="pill-item">
                        <span class="pill-icon">🎴</span> Memory Game
                    </div>
                    <div class="pill-item">
                        <span class="pill-icon">⚓</span> Battleship
                    </div>
                    <div class="pill-item">
                        <span class="pill-icon">🎲</span> Snake & Ladders
                    </div>
                </div>
            </section>

            <!-- RIGHT SIDE: CLEAN LOGIN CARD -->
            <section class="welcome-right">
                <div class="login-card">
                    <div class="card-header">
                        <h2 class="card-title">Welcome Back</h2>
                        <p class="card-subtitle">Enter your player name to continue</p>
                    </div>

                    <form class="login-form" action="home.html" method="GET">
                        <div class="input-group">
                            <label for="usernameInput" class="input-label">Player Username</label>
                            <div class="input-wrapper">
                                <span class="input-icon">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                                </span>
                                <input type="text" id="usernameInput" class="form-input" placeholder="Enter username..." value="Player1" required>
                            </div>
                        </div>

                        <a href="home.html" class="btn-primary login-btn">
                            <span>ENTER GAMESPHERE</span>
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
                        </a>
                    </form>
                </div>
            </section>

        </main>
    </div>

</body>
</html>
